<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E13;--surface:#343A40;--surface2:#454C54;
  --line:rgba(245,247,250,0.09);--text:#F2F5F8;--muted:#8C9AA6;
  --gold:#E8B94B;--danger:#FF5C5C;--radius:14px;
  --c-R:#FF4D4D;--c-Y:#FFD23F;--c-G:#33D686;--c-B:#4DA6FF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;color:var(--text);}
body{font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
#app{max-width:600px;margin:0 auto;padding:0 12px 60px;}
h1,h2,h3{font-family:'Oswald',sans-serif;margin:0;text-transform:uppercase;}

/* header */
.hdr{
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;margin:14px 0 16px;position:relative;overflow:hidden;
}
.hdr::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 15% -10%,rgba(255,77,77,.10),transparent 40%),
             radial-gradient(circle at 85% -10%,rgba(77,166,255,.10),transparent 40%);
  pointer-events:none;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;}
.hdr h1{font-size:24px;letter-spacing:.03em;font-weight:700;margin-top:4px;}
.hdr-dots{margin-top:8px;font-size:18px;letter-spacing:6px;}
.hdr-sub{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.5;}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card h2{font-size:14px;letter-spacing:.04em;margin-bottom:3px;}
.card .hint{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.5;}

/* setup */
.preset-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.preset-btn{
  flex:1;min-width:80px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;
  padding:11px 6px;border-radius:10px;cursor:pointer;transition:.15s;
}
.preset-btn:hover{border-color:var(--gold);}
.preset-btn.active{background:rgba(232,185,75,.14);border-color:var(--gold);color:var(--gold);}
.field-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:10px;}
.field-row label{font-size:12.5px;color:var(--muted);}
.num-input{
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  font-family:'JetBrains Mono',monospace;font-size:14px;
  padding:7px 9px;border-radius:8px;width:76px;text-align:center;
}
.custom-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.custom-row .num-input{width:68px;}
.preview-box{
  background:var(--surface2);border:1px dashed var(--line);border-radius:10px;
  padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.8;
}
.preview-box b{color:var(--text);font-weight:600;}
.preview-box .warn{color:var(--danger);font-weight:600;}

/* first-match picker */
.first-match-label{font-size:12.5px;color:var(--muted);margin:12px 0 8px;}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
.team-tile{
  background:var(--surface2);border:2px solid var(--line);border-radius:10px;
  padding:10px 4px;cursor:pointer;text-align:center;transition:.15s;
}
.team-tile .tile-emoji{font-size:22px;display:block;}
.team-tile .tile-name{font-size:11px;color:var(--muted);display:block;margin-top:3px;}
.team-tile.sel-1{border-color:var(--gold);background:rgba(232,185,75,.12);}
.team-tile.sel-2{border-color:var(--gold);background:rgba(232,185,75,.20);}
.vs-badge{
  text-align:center;font-size:12px;color:var(--muted);margin:0 0 10px;
  font-family:'JetBrains Mono',monospace;
}
.vs-badge b{color:var(--text);}

.btn-primary{
  width:100%;margin-top:12px;background:var(--gold);color:#1A1300;border:none;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.04em;text-transform:uppercase;padding:13px;border-radius:10px;
  cursor:pointer;transition:.15s;
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}

/* info strip */
.info-strip{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:12px;font-size:12px;
}
.info-strip div{color:var(--muted);}
.info-strip b{color:var(--text);font-family:'JetBrains Mono',monospace;display:block;font-size:13px;margin-top:2px;}

/* standings */
table.standings{width:100%;border-collapse:collapse;font-size:12.5px;}
table.standings th{
  text-align:center;color:var(--muted);font-weight:500;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;padding:5px 3px;border-bottom:1px solid var(--line);
}
table.standings th.tc,table.standings td.tc{text-align:left;}
table.standings td{text-align:center;padding:8px 3px;font-family:'JetBrains Mono',monospace;border-bottom:1px solid var(--line);}
table.standings tr:last-child td{border-bottom:none;}
.rpill{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;}
tr.rank-1 .rpill,tr.rank-2 .rpill{background:rgba(232,185,75,.18);color:var(--gold);}
tr.rank-3 .rpill,tr.rank-4 .rpill{background:rgba(140,154,166,.15);color:var(--muted);}
tr.rank-1,tr.rank-2{background:rgba(232,185,75,.04);}
.tcell{display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;font-weight:500;}
.pts{color:var(--text);font-weight:700;}

/* section label */
.sec{
  display:flex;align-items:center;gap:8px;
  margin:20px 2px 8px;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-family:'JetBrains Mono',monospace;
}
.sec::after{content:"";flex:1;height:1px;background:var(--line);}

/* ── MATCH ROW ──────────────────────────────────────────── */
.mr{
  display:grid;
  grid-template-columns:15% 1fr 15%;
  align-items:stretch;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:8px;
  position:relative;
  min-height:56px;
}
.mr.nxt{border-color:var(--line);box-shadow:none;}
.mr.nxt::before{content:none;}
@media(prefers-reduced-motion:no-preference){
  .mr.nxt{animation:none;}
}
@keyframes pglow{
  0%,100%{box-shadow:0 0 0 1px var(--gold);}
  50%{box-shadow:0 0 0 1px var(--gold),0 0 12px rgba(232,185,75,.3);}
}

/* coloured side panels */
.mz-side{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px;
}
/* left side gets right-border; right side gets left-border — colours applied inline via style */
.mz-side.left{border-right:1px solid var(--line);}
.mz-side.right{border-left:1px solid var(--line);}
.mz-side .s-emoji{font-size:20px;line-height:1;}
.mz-side .s-name{font-size:10px;font-family:'Inter',sans-serif;font-weight:600;}
.mz-side.provisional .s-name::after{content:"";}

/* centre score zone */
.mz-ctr{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 10px;gap:4px;
}
.stage-lbl{font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.score-inline{
  display:flex;align-items:center;gap:6px;
}
.sc-half{display:flex;align-items:center;gap:4px;}
.sc-btn{
  width:26px;height:26px;border-radius:7px;
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
  font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sc-btn:active{transform:scale(.88);}
.sc-num{
  font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;
  color:var(--text);line-height:1;min-width:22px;text-align:center;
}
.sc-sep{color:var(--muted);font-size:18px;font-family:'JetBrains Mono',monospace;line-height:1;}

/* misc */
.locked-note{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 2px;}
.share-note{font-size:11px;color:var(--muted);text-align:center;margin:14px 0 6px;line-height:1.6;}
.sync-warn{
  font-size:11px;color:var(--gold);text-align:center;margin:0 0 8px;line-height:1.6;
  background:rgba(232,185,75,.08);border:1px solid rgba(232,185,75,.25);border-radius:10px;padding:7px 10px;
}
.btn-reset{
  display:block;width:auto;margin:18px auto 2px;background:var(--surface2);border:1px solid var(--line);
  color:var(--muted);font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0;
  padding:8px 14px;border-radius:9px;cursor:pointer;
}
.btn-reset:hover{filter:brightness(1.08);}
@media(max-width:380px){.sc-num{font-size:22px;}.mz-side .s-emoji{font-size:17px;}}

/* tabs / compact layout */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0 12px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:sticky;top:6px;z-index:20;backdrop-filter:blur(8px);}
.tab-btn{border:0;background:transparent;color:var(--muted);padding:10px 8px;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
.tab-btn.active{background:var(--surface2);color:var(--text);box-shadow:0 0 0 1px var(--line) inset;}
.summary-line{font-size:12px;line-height:1.8;color:var(--muted);padding:3px 2px 12px;}
.summary-line b{color:var(--text);font-weight:600;}
.settings-title{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin:16px 2px 8px;}
.settings-block{border-top:1px solid var(--line);padding-top:12px;margin-top:8px;}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:0;}
.settings-row .label{font-size:13px;color:var(--text);}
.settings-row .sub{font-size:11px;color:var(--muted);margin-top:2px;}

.settings-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.settings-card .summary-line{padding:0 0 14px;margin-bottom:4px;border-bottom:1px solid var(--line);}
.settings-card .settings-title{margin:14px 0 4px;}
.settings-section{padding:13px 0;border-bottom:1px solid var(--line);}
.settings-section:last-of-type{border-bottom:0;}
.settings-section h2{font-size:14px;letter-spacing:.04em;margin-bottom:3px;}
.settings-section .hint{color:var(--muted);font-size:12px;margin-bottom:10px;line-height:1.5;}

.empty-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;}
.result-heading{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:18px 2px 8px;display:flex;align-items:center;gap:8px;}
.result-heading::after{content:"";flex:1;height:1px;background:var(--line);}
.mz-side .s-name{font-size:11px;color:#fff!important;font-weight:700;}
.mz-side .s-emoji{display:none;}



/* v2 typography + fixed menu refinements */
body{background:#D9DDE1;color:#111;}
#app{padding-top:76px;}
.tabs{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  width:min(576px,calc(100% - 24px));
  margin:0;padding:8px 4px 6px;
  border-radius:0 0 12px 12px;z-index:999;
  background:var(--surface);border:1px solid var(--line);border-top:0;
  box-shadow:0 4px 14px rgba(0,0,0,.16);backdrop-filter:none;
  -webkit-transform:translateX(-50%);
}
body{padding-top:env(safe-area-inset-top,0px);}
.result-heading,.sec{
  color:#111!important;font-size:14px!important;font-weight:800!important;
  letter-spacing:.02em!important;text-transform:none!important;
  font-family:'Inter',sans-serif!important;margin:22px 2px 10px!important;
}
.result-heading::after,.sec::after{background:#111!important;opacity:.20;}
.settings-title{color:#fff;font-size:14px;font-weight:700;}
.card,.settings-card,.info-strip,.tabs,.mr{color:#fff;}
.card h2{font-size:14px;font-weight:700;color:#fff;}
.card .hint,.summary-line,.settings-row .sub,.stage-lbl,.locked-note{font-size:13px;}
.settings-row .label,.summary-line,.summary-line b,.settings-card,.card,.standings th,.standings td,.stage-lbl,.sc-num,.sc-sep,.locked-note{color:#fff;}
table.standings th{font-size:12px;font-weight:600;color:#fff;}
table.standings td{font-size:12.5px;color:#fff;}
.tcell{font-size:13px;font-weight:600;}
.team-chip{display:inline-flex;align-items:center;gap:7px;}
.team-dot{width:22px;height:14px;border-radius:4px;display:inline-block;flex:0 0 auto;}
.playoff-meta{font-size:12px;font-weight:600;color:#111;margin:-4px 2px 9px;}

.color-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px;}
.color-pick{position:relative;min-height:46px;border:2px solid transparent;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;}
.color-pick.selected{outline:2px solid var(--gold);outline-offset:2px;}
.pick-order{font-size:16px!important;font-weight:800!important;position:absolute;right:6px;top:5px;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;background:#111;color:#fff;font-size:10px;font-weight:700;}
.color-picker-card .hint{color:#fff;opacity:.75;}


/* white team readability in match results */
.mz-side.team-W .s-name{color:#111111!important;}


/* === unified typography === */
body,button,input,select,textarea,
.card,.settings-card,.info-strip,.tabs,.mr,
.card .hint,.summary-line,.settings-row .sub,.settings-row .label,
table.standings th,table.standings td,.tcell,
.stage-lbl,.sc-num,.sc-sep,.locked-note,.share-note,.vs-badge,
.color-pick,.tab-btn,.btn-primary,.btn-reset,.playoff-meta,
.mz-side .s-name{
  font-size:14px!important;
}
.card h2,.settings-title,.result-heading,.sec,.tab-btn.active{
  font-size:14px!important;
  font-weight:800!important;
}
.card h2,.settings-title,.result-heading,.sec{
  letter-spacing:0!important;
}
.sc-num{line-height:1!important;}


/* score emphasis + outside-page text */
.sc-num{font-size:28px!important;font-weight:700!important;}
.result-heading,.sec,.playoff-meta{color:#111!important;}


/* === 7px radius trial === */
.card,.settings-card,.info-strip,.tabs,.mr,
.preset-btn,.num-input,.preview-box,.team-tile,.btn-primary,
.sc-btn,.sync-warn,.btn-reset,.tab-btn,.color-pick,.team-chip,
.rpill,.pick-order{
  border-radius:7px!important;
}


/* === mobile score-row refinement === */
.mr{grid-template-columns:18% 1fr 18%!important;}
.mz-ctr{padding:7px 5px!important;}
.score-inline{width:100%;justify-content:center;gap:5px!important;flex-wrap:nowrap;}
.stage-lbl{
  flex:0 0 auto;
  white-space:nowrap;
  margin-right:2px;
  font-size:11px!important;
  font-weight:700!important;
}
.sc-num{
  font-size:34px!important;
  min-width:28px!important;
}
.sc-half{gap:3px!important;}
.sc-btn{width:28px!important;height:30px!important;padding:0!important;}
@media(max-width:420px){
  #app{padding-left:8px!important;padding-right:8px!important;}
  .mr{grid-template-columns:17% 1fr 17%!important;}
  .mz-side{padding:7px 3px!important;}
  .mz-side .s-name{font-size:12px!important;}
  .mz-ctr{padding:6px 3px!important;}
  .score-inline{gap:3px!important;}
  .stage-lbl{font-size:10px!important;margin-right:1px;}
  .sc-btn{width:26px!important;height:30px!important;}
  .sc-num{font-size:32px!important;min-width:25px!important;}
  .sc-sep{font-size:18px!important;}
}
@media(max-width:350px){
  .stage-lbl{font-size:9px!important;}
  .sc-btn{width:24px!important;}
  .sc-num{font-size:29px!important;min-width:22px!important;}
}


/* mobile readability update */
body,button,input,select,textarea,.card,.settings-card,.info-strip,.tabs,.mr,.card .hint,.summary-line,.settings-row .sub,.settings-row .label,table.standings th,table.standings td,.tcell,.stage-lbl,.sc-sep,.locked-note,.share-note,.vs-badge,.color-pick,.tab-btn,.btn-primary,.btn-reset,.playoff-meta,.mz-side .s-name{font-size:15px!important;}
.card h2,.settings-title,.result-heading,.sec,.tab-btn.active{font-size:15px!important;font-weight:800!important;}
.sc-num{font-size:36px!important;font-weight:700!important;}


/* === adjustable font size === */
:root{--app-font-size:15px;}
body,button,input,select,textarea,
.card,.settings-card,.info-strip,.tabs,.mr,
.card .hint,.summary-line,.settings-row .sub,.settings-row .label,
table.standings th,table.standings td,.tcell,
.stage-lbl,.sc-sep,.locked-note,.share-note,.vs-badge,
.color-pick,.tab-btn,.btn-primary,.btn-reset,.playoff-meta,
.mz-side .s-name,
.settings-section h2,.settings-section label{
  font-size:var(--app-font-size)!important;
}
.card h2,.settings-title,.result-heading,.sec,.tab-btn.active{
  font-size:var(--app-font-size)!important;
  font-weight:800!important;
}
.sc-num{
  font-size:calc(var(--app-font-size) + 21px)!important;
}


/* latest visual refinements */
.mz-side.team-Y .s-name{color:#111111!important;}

/* standings: color bar only, no color name */
.team-chip .team-name-text{display:none!important;}
.team-dot{
  width:34px!important;
  height:22px!important;
  border-radius:4px!important;
  display:inline-block!important;
  flex:0 0 34px!important;
}

/* settings label standard white */
.settings-section .field-row label{color:#fff!important;}

/* playoff spacing: heading belongs to the row below */
.playoff-meta{
  margin:10px 2px 3px!important;
  color:#111!important;
  font-weight:800!important;
}
.playoff-meta + .mr{
  margin-top:0!important;
}


/* requested final corrections */
.btn-reset{color:#FFFFFF!important;}
.standings .team-chip{justify-content:center!important;}
.standings .team-dot{
  width:42px!important;
  height:24px!important;
  min-width:42px!important;
  border-radius:5px!important;
  display:inline-block!important;
  box-sizing:border-box;
}


/* standings row grouping */
.standings tbody tr:nth-child(odd){background:rgba(255,255,255,.055)!important;}
.standings tbody tr:nth-child(even){background:rgba(255,255,255,.015)!important;}
/* stronger divider between ranks 1–2 and 3–4 */
.standings tbody tr:nth-child(3) td{
  border-top:3px solid rgba(255,255,255,.42)!important;
}


/* ranks 3–4: white rank numbers */
.standings tbody tr:nth-child(3) .rpill,
.standings tbody tr:nth-child(4) .rpill{
  color:#fff!important;
}


/* subtler divider between rank 2 and 3 */
.standings tbody tr:nth-child(3) td{
  border-top-width:2px!important;
  border-top-color:rgba(255,255,255,.28)!important;
}


/* unified ranking number style */
.standings .rpill{
  color:#fff!important;
  background:rgba(255,255,255,.12)!important;
}
.standings tr.rank-1 .rpill,
.standings tr.rank-2 .rpill,
.standings tr.rank-3 .rpill,
.standings tr.rank-4 .rpill{
  color:#fff!important;
  background:rgba(255,255,255,.12)!important;
}


/* latest typography / standings heading */
.sc-num{font-size:calc(var(--app-font-size) + 17px)!important;}


/* match border = score area background */
.mr{
  border-color:var(--surface2)!important;
}


/* top menu: keep original layout/width, only disable sticky */
.tabs{
  position:relative!important;
  top:auto!important;
  z-index:auto!important;
}


/* menu alignment: same width as content cards, close to page top */
.tabs{
  width:100%!important;
  max-width:none!important;
  margin:6px 0 10px!important;
  position:relative!important;
  top:auto!important;
  left:auto!important;
  transform:none!important;
  box-sizing:border-box!important;
}

/* settings page section heading */
.settings-page-heading{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 2px 8px;
  color:#111;
  font-family:'Inter',sans-serif;
  font-size:var(--app-font-size);
  font-weight:800;
}
.settings-page-heading::after{
  content:"";
  flex:1;
  height:1px;
  background:#111;
  opacity:.2;
}


/* top spacing refinement */
#app{
  padding-top:2px!important;
}
.tabs{
  margin-top:0!important;

          if(state.teamColors&&state.teamColors.length) selectedColors=state.teamColors.slice();
        }
        try{localStorage.setItem(SK+"_"+REMOTE_ID,JSON.stringify(state));}catch(e){}
        render();
      }
    }
  }catch(e){
    console.warn("Supabase poll failed",e);
  }
}

// ── setup state ────────────────────────────────────────────────────────────────
var setupMode="preset150",setupBudget=150,setupCustomMins=150,setupBreak=2;
var setupGameMins=8;
var setupFontSize=16;
var scorePulse=null;
var currentTab="schedule";

function suggestBreak(b){var v=Math.floor((b-112)/13);return Math.max(0,Math.min(6,v));}
function computeSched(budget,brk){
  var teams=setupTeamCount;
  var groupMatches=(teams*(teams-1)/2)*2;
  var gf=groupMatches*setupGameMins;
  var playoffMatches=teams===4?2:1;
  var totalMatches=groupMatches+playoffMatches;
  var gaps=Math.max(0,totalMatches-1);
  var rem=budget-gf-gaps*brk;
  var minPlayoff=8*playoffMatches;
  var insuf=rem<minPlayoff;
  if(teams===4){
    var each=insuf?8:Math.floor(rem/2);
    return{gf:gf,gaps:gaps,rem:rem,insuf:insuf,groupMatches:groupMatches,thirdMin:each,finalMin:each+(!insuf&&rem%2?1:0)};
  }
  return{gf:gf,gaps:gaps,rem:rem,insuf:insuf,groupMatches:groupMatches,thirdMin:0,finalMin:insuf?8:rem};
}

// ── actions ────────────────────────────────────────────────────────────────────
async function startTournament(){
  var budget=setupMode==="custom"?setupCustomMins:setupBudget;
  var brk=setupBreak;
  var sched=computeSched(budget,brk);
  var teams=activeTeams();
  if(teams.length!==setupTeamCount){alert("กรุณาเลือกสีให้ครบตามจำนวนทีม");return;}
  var first=[teams[0],teams[1]];
  var order=findSchedule(first);
  if(!order){alert("ไม่สามารถสร้างตารางการแข่งขันได้");return;}
  var matches=[];
  order.forEach(function(p,i){
    matches.push({id:"g"+i,stage:"group",team1:p[0],team2:p[1],dur:setupGameMins,s1:0,s2:0,played:false});
  });
  if(setupTeamCount===4) matches.push({id:"third",stage:"third",dur:sched.thirdMin,s1:0,s2:0,played:false});
  matches.push({id:"final",stage:"final",dur:sched.finalMin,s1:0,s2:0,played:false});
  state={started:true,fieldName:(state&&state.fieldName)||FIELD_NAME||REMOTE_ID,teamCount:setupTeamCount,teamColors:teams.slice(),startTime:Date.now(),totalBudget:budget,breakMins:brk,gameMins:setupGameMins,sched,matches,updatedAt:Date.now()};
  currentTab="schedule";
  render();savePending=true;flushSave();
}

function bump(id,side,d){
  var m=state.matches.find(function(x){return x.id===id;});
  if(!m) return;

  var wasPlayed=m.played;
  var idx=state.matches.indexOf(m);
  var hasLaterPlayed=state.matches.slice(idx+1).some(function(x){
    return x.stage==="group"&&x.played;
  });

  /* If the match is still blank, minus does nothing. */
  if(!m.played){
    if(d<0) return;
    m.s1=0;m.s2=0;m.played=true;
  }

  var k=side===1?"s1":"s2";
  m[k]=Math.max(0,m[k]+d);

  /* A previously recorded match changed after a later match has results. */
  if(wasPlayed&&hasLaterPlayed){
    m.retroEditedAt=Date.now();
  }

  /* When both scores are reduced back to 0-0, return to blank - : -. */
  if(m.s1===0&&m.s2===0){
    m.played=false;
  }

  render();scheduleSave();
}

// ── standings ──────────────────────────────────────────────────────────────────
function standings(matches){
  var teams=(state&&state.started&&Array.isArray(state.teamColors)?state.teamColors.slice():activeTeams());
  var t={};
  teams.forEach(function(c){t[c]={code:c,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});
  matches.filter(function(m){return m.stage==="group"&&m.played;}).forEach(function(m){
    var a=t[m.team1],b=t[m.team2],s1=m.s1,s2=m.s2;
    a.P++;b.P++;a.GF+=s1;a.GA+=s2;b.GF+=s2;b.GA+=s1;
    if(s1>s2){a.W++;a.Pts+=3;b.L++;}
    else if(s1<s2){b.W++;b.Pts+=3;a.L++;}
    else{a.D++;b.D++;a.Pts++;b.Pts++;}
  });
  teams.forEach(function(c){t[c].GD=t[c].GF-t[c].GA;});
  return teams.map(function(c){return t[c];}).sort(function(x,y){
    if(y.Pts!==x.Pts) return y.Pts-x.Pts;
    if(y.GD!==x.GD) return y.GD-x.GD;
    if(y.GF!==x.GF) return y.GF-x.GF;
    return teams.indexOf(x.code)-teams.indexOf(y.code);
  });
}

function fmtClock(ts){var d=new Date(ts),h=String(d.getHours()).padStart(2,"0"),m=String(d.getMinutes()).padStart(2,"0");return h+":"+m;}

function nextUpId(matches){
  var now=Date.now();
  var u=matches.find(function(m){return(m._end||0)>now;});
  return u?u.id:matches[matches.length-1].id;
}

// Display-only orientation for group matches.
// If a team plays in two consecutive matches, keep that team on the same visual side.
// This never changes schedule order, stored teams, scores, or standings logic.
function applyDisplayOrientation(groupMatches){
  groupMatches.forEach(function(m){m._displaySwap=false;});
  if(!groupMatches.length) return;

  function oriented(m){
    return m._displaySwap?[m.team2,m.team1]:[m.team1,m.team2];
  }

  for(var i=1;i<groupMatches.length;i++){
    var prev=groupMatches[i-1], cur=groupMatches[i];
    var po=oriented(prev);
    var shared=[];
    [cur.team1,cur.team2].forEach(function(t){if(po.indexOf(t)>=0) shared.push(t);});
    if(!shared.length) continue;

    // For a single shared team, put it on the same side as in the previous row.
    // For an exact repeated pairing, preserve both sides.
    if(shared.length===1){
      var t=shared[0], prevSide=po[0]===t?0:1;
      var naturalSide=cur.team1===t?0:1;
      cur._displaySwap=(naturalSide!==prevSide);
    }else{
      cur._displaySwap=!(cur.team1===po[0]&&cur.team2===po[1]);
    }
  }
}

function retroTime(ts){

function ensureScoreAudio(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    if(!window._scoreAudioCtx) window._scoreAudioCtx=new AC();
    var ctx=window._scoreAudioCtx;
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }catch(e){return null;}
}

function playScoreClick(isPlus){
  try{
    var ctx=ensureScoreAudio();
    if(!ctx) return;

    var now=ctx.currentTime;
    var osc=ctx.createOscillator();
    var gain=ctx.createGain();

    osc.type=isPlus?"square":"sine";
    osc.frequency.setValueAtTime(isPlus?760:420,now);

    gain.gain.setValueAtTime(isPlus?0.12:0.07,now);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.055);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now+0.06);
  }catch(e){}
}

function bindEvents(){
  ["touchstart","pointerdown","click"].forEach(function(evt){
    document.addEventListener(evt,function unlockOnce(){

  });});
  // preset buttons
  document.querySelectorAll("[data-preset]").forEach(function(b){
    b.addEventListener("click",function(){
      setupMode=b.getAttribute("data-preset");
      if(setupMode==="preset120") setupBudget=120;
      if(setupMode==="preset150") setupBudget=150;
      render();
    });
  });
  var ci=document.getElementById("customMins");
  if(ci) ci.addEventListener("input",function(){setupCustomMins=parseInt(ci.value||"0")||0;render();});
  var gi=document.getElementById("gameMinsInput");
  if(gi) gi.addEventListener("input",function(){setupGameMins=Math.max(1,parseInt(gi.value||"8")||8);render();});
  var bi=document.getElementById("breakInput");
  if(bi) bi.addEventListener("input",function(){setupBreak=parseInt(bi.value||"0")||0;render();});

  document.querySelectorAll("[data-color]").forEach(function(tile){
    tile.addEventListener("click",function(){
      var t=tile.getAttribute("data-color");
      var idx=selectedColors.indexOf(t);
      if(idx>=0){selectedColors.splice(idx,1);}
      else if(selectedColors.length<setupTeamCount){selectedColors.push(t);}
      render();
    });
  });

  var sb=document.getElementById("startBtn");
  if(sb) sb.addEventListener("click",function(){
    var bud=setupMode==="custom"?setupCustomMins:setupBudget;
    if(!bud||bud<60){alert("กรุณาระบุเวลารวมอย่างน้อย 60 นาที");return;}
    startTournament();
  });

  // score buttons
  document.querySelectorAll("[data-act]").forEach(function(el){
    el.addEventListener("click",function(){
      var a=el.getAttribute("data-act"),id=el.getAttribute("data-id");
      if(a==="inc1"){playScoreClick(true);scorePulse={id:id,side:1};bump(id,1,1);}
      else if(a==="dec1"){playScoreClick(false);scorePulse={id:id,side:1};bump(id,1,-1);}
      else if(a==="inc2"){playScoreClick(true);scorePulse={id:id,side:2};bump(id,2,1);}
      else if(a==="dec2"){playScoreClick(false);scorePulse={id:id,side:2};bump(id,2,-1);}
      setTimeout(function(){scorePulse=null;},300);
    });
  });

  var rb=document.getElementById("resetBtn");
  if(rb) rb.addEventListener("click",doReset);
}

// ── init ───────────────────────────────────────────────────────────────────────
async function init(){
  if(!HAS_FIELD_ID){
    var app=document.getElementById("app");
    app.innerHTML='<div class="no-field"><div class="no-field-card"><h2>SCORE</h2><p>กรุณาเปิดผ่านลิงก์สนามที่ได้รับจากผู้ดูแล</p></div></div>';
    return;
  }
  try{
    var fs=parseInt(localStorage.getItem("tournament_font_size"),10);
    if(fs===14||fs===15||fs===16) setupFontSize=fs;
  }catch(e){}
  await loadState();
  if(state&&state.matches){
    state.matches.forEach(function(m){if(typeof m.played!=="boolean")m.played=(m.s1!==0||m.s2!==0);});
    setupTeamCount=state.teamCount||4;
    setupGameMins=state.gameMins||8;
    if(state.teamColors&&state.teamColors.length) selectedColors=state.teamColors.slice();
  }
  currentTab="schedule";
  render();
  setInterval(pollRemote,2000);
}
init();
})();
</script>
</body>
</html>
