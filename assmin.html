<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCORE Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Arial,sans-serif;color:#111;background:#d9dde1}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#d9dde1}
.wrap{max-width:720px;margin:auto}
h1{margin:0 0 12px;font-size:22px}
.card{background:#343a40;color:#fff;border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input{flex:1;min-width:180px;padding:11px 12px;border-radius:7px;border:1px solid #666;font-size:16px}
button{padding:11px 14px;border-radius:7px;border:1px solid #777;background:#454c54;color:#fff;font-size:16px;font-weight:700}
button.primary{border-color:#facc15}
button.danger{opacity:.72}
.list{display:grid;gap:8px}
.item{background:#343a40;color:#fff;border-radius:10px;padding:12px}
.item-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font-weight:800}
.muted{opacity:.65;font-size:13px}
.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
a.btn{display:inline-block;padding:8px 10px;border-radius:7px;background:#454c54;color:#fff;text-decoration:none;font-weight:700}
.status{margin-top:8px;font-size:13px;opacity:.8}

.actions .btn,
.actions button{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  height:38px!important;
  padding:0 10px!important;
  line-height:1!important;
  font-family:inherit!important;
  font-size:16px!important;
  font-weight:700!important;
  vertical-align:middle!important;
}

</style>
</head>
<body>
<div class="wrap">
  <h1>SCORE Admin</h1>
  <div class="card">
    <div class="row">
      <input id="fieldName" placeholder="ชื่อสนาม / ชื่อกลุ่ม">
      <button class="primary" id="createBtn">สร้างสนาม</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
const SUPABASE_URL="https://afngojrtekieyndjzwwa.supabase.co";
const SUPABASE_KEY="sb_publishable_7PjmLJxgJaobwvuo9bZbNg_u2w227at";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const list=document.getElementById("list");
const status=document.getElementById("status");

function code(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s="";
  for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function load(){
  const res=await sb.from("tournament_state").select("id,data,updated_at").order("updated_at",{ascending:false});
  if(res.error){status.textContent="โหลดรายการไม่สำเร็จ";return;}
  list.innerHTML="";
  (res.data||[]).filter(x=>x.id!=="main").forEach(x=>{
    const name=(x.data&&typeof x.data.fieldName==="string")?x.data.fieldName.trim():"";
    const basePath=location.pathname.replace(/[^/]+$/,"");
    const url=location.origin+basePath+"?id="+encodeURIComponent(x.id);
    const div=document.createElement("div");
    div.className="item";
    div.innerHTML='<div class="item-top"><div><div class="code">'+esc(name||"ยังไม่ได้ตั้งชื่อสนาม")+'</div><div class="muted">ID '+esc(x.id)+'</div></div></div>'+
      '<div class="actions"><a class="btn" href="'+url+'" target="_blank">เปิดสนาม</a>'+
      '<button data-copy="'+url+'">คัดลอกลิงก์</button>'+
      '<button data-edit="'+esc(x.id)+'" data-name="'+esc(name)+'">แก้ไข</button>'+
      '<button class="danger" data-delete="'+esc(x.id)+'" data-name="'+esc(name)+'">ลบ</button></div>';
    list.appendChild(div);
  });
  list.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="คัดลอกแล้ว";}
    catch(e){prompt("คัดลอกลิงก์นี้",b.dataset.copy);}
  }));
  list.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",async()=>{
    const id=b.dataset.edit;
    const oldName=b.dataset.name||"";
    const newName=prompt("แก้ไขชื่อสนาม",oldName);
    if(newName===null) return;
    const name=newName.trim();
    if(!name) return;
    const read=await sb.from("tournament_state").select("data").eq("id",id).single();
    if(read.error){status.textContent="อ่านข้อมูลสนามไม่สำเร็จ";return;}
    const data=Object.assign({},read.data.data||{},{fieldName:name,updatedAt:Date.now()});
    const res=await sb.from("tournament_state").update({data,updated_at:new Date().toISOString()}).eq("id",id);
    if(res.error){status.textContent="แก้ไขชื่อไม่สำเร็จ";return;}
    status.textContent="แก้ไขชื่อสนามแล้ว";
    load();
  }));

  list.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",async()=>{
    const id=b.dataset.delete;
    const name=b.dataset.name||id;
    if(!confirm('ลบสนาม "'+name+'" ?\n\nข้อมูลคะแนนของสนามนี้จะถูกลบด้วย')) return;
    const res=await sb.from("tournament_state").delete().eq("id",id);
    if(res.error){status.textContent="ลบสนามไม่สำเร็จ";return;}
    status.textContent="ลบสนาม "+name+" แล้ว";
    load();
  }));
}

document.getElementById("createBtn").addEventListener("click",async()=>{
  const name=document.getElementById("fieldName").value.trim()||"สนาม";
  const id=code();
  const data={started:false,fieldName:name,createdAt:Date.now(),updatedAt:Date.now()};
  const res=await sb.from("tournament_state").upsert({id,data,updated_at:new Date().toISOString()},{onConflict:"id"});
  if(res.error){status.textContent="สร้างสนามไม่สำเร็จ";return;}
  status.textContent="สร้างสนาม "+name+" แล้ว";
  document.getElementById("fieldName").value="";
  load();
});
load();
</script>
</body>
</html>
